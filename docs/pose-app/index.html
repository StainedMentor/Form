<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="In-browser pose estimation from your device camera." />
  <title>Pose Cam</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1>Pose Cam</h1>
        <p>Live body tracking in your browser. Video stays on this device.</p>
      </div>
    </header>

    <main class="main">
      <div class="toolbar">
        <button type="button" class="btn btn-primary" id="start-btn">Start</button>
        <button type="button" class="btn btn-danger" id="stop-btn" hidden>Stop</button>
        <span class="pill" id="model-pill">Model idle</span>
      </div>

      <p class="status" id="status" role="status">Press Start to open the camera and load the pose model.</p>

      <div class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas" aria-label="Camera preview with pose skeleton"></canvas>
        <div class="stage-empty" id="stage-empty">Camera off</div>
      </div>
    </main>

    <footer class="footer">
      <p>Powered by MediaPipe Pose Landmarker · runs fully client-side</p>
    </footer>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
