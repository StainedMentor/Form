<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5fff" />
  <meta name="description" content="Planer javnog prevoza za Sarajevo — pronađite najbolju rutu tramvajem, autobusom i trolejbusom." />
  <title>Prevoz KS — Sarajevo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🚋</span>
        <div>
          <h1>Prevoz KS</h1>
          <p>Javni prevoz Sarajevo</p>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="planner card" aria-label="Planer putovanja">
        <div class="field-group">
          <label class="sr-only" for="from-input">Polazište</label>
          <div class="field from-field">
            <span class="field-dot from-dot" aria-hidden="true"></span>
            <input id="from-input" type="search" autocomplete="off" enterkeyhint="search" placeholder="Odakle putujete?" />
            <button type="button" class="icon-btn" id="locate-btn" title="Moja lokacija" aria-label="Koristi moju lokaciju">📍</button>
          </div>
          <button type="button" class="swap-btn" id="swap-btn" aria-label="Zamijeni polazište i odredište">⇅</button>
          <label class="sr-only" for="to-input">Odredište</label>
          <div class="field to-field">
            <span class="field-dot to-dot" aria-hidden="true"></span>
            <input id="to-input" type="search" autocomplete="off" enterkeyhint="search" placeholder="Kamo idete?" />
          </div>
        </div>

        <ul class="suggestions" id="suggestions" hidden></ul>

        <button type="button" class="primary-btn" id="search-btn">Pronađi rutu</button>
        <p class="hint">Pretražite stajališta ili adrese u Sarajevu</p>
      </section>

      <section class="status card" id="status" hidden></section>

      <section class="results card" id="results" hidden>
        <div class="results-header">
          <h2>Predložene rute</h2>
          <span id="results-count"></span>
        </div>
        <div id="routes-list"></div>
      </section>

      <section class="map-card card" id="map-section" hidden>
        <h2>Mapa rute</h2>
        <div id="map" role="img" aria-label="Mapa odabrane rute"></div>
      </section>
    </main>

    <footer class="footer">
      <p>
        Rutiranje: <a href="https://transitous.org" target="_blank" rel="noopener">Transitous</a> ·
        Podaci: <a href="https://gitlab.com/vekejsn/gtfs-generators" target="_blank" rel="noopener">GTFS KS</a> ·
        Mapa: <a href="https://www.openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a>
      </p>
      <p class="disclaimer">Informativnog karaktera. Provjerite red vožnje prije putovanja.</p>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js" type="module"></script>
</body>
</html>
